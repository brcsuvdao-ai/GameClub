<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GameClub - Pilot Caola</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #060811; color: #b7bfc2;
      font-family: "Courier New", Courier, monospace;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .viewport { width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 4px; overflow: hidden; }
    .cabinet {
      position: relative; height: 100%; max-height: 860px; aspect-ratio: 9 / 16; max-width: 100%;
      border: 2px solid rgba(56, 232, 255, 0.55); background: #060811;
      box-shadow: 0 0 28px rgba(56, 232, 255, 0.2); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .hidden { display: none !important; }
    .lobby-top {
      position: absolute; left: 0; right: 0; top: 0; z-index: 20;
      padding: 8px; display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; font-weight: bold; letter-spacing: 0.04em;
    }
    .lobby-badges { display: flex; gap: 5px; align-items: center; }
    .badge { padding: 2px 5px; background: #0e1526; }
    .b-caola { border: 1px solid rgba(34, 197, 94, 0.65); color: #86efac; }
    .b-gpu { border: 1px solid rgba(250, 204, 21, 0.65); color: #fde047; }
    .b-rtx { border: 1px solid rgba(56, 232, 255, 0.65); color: #b8f8ff; }
    .lobby-panel {
      position: absolute; left: 10px; right: 10px; top: 47%; bottom: 10px; z-index: 20;
      background: rgba(8, 12, 24, 0.95); border: 2px solid rgba(56, 232, 255, 0.72);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-head {
      padding: 6px 10px; background: #0f172a; border-bottom: 1px solid rgba(56, 232, 255, 0.4);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; font-weight: bold; color: #38e8ff;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 9px; display: flex; flex-direction: column; gap: 7px; }
    .box { padding: 7px 8px; background: #0d1324; border: 1px solid #334155; font-size: 10px; line-height: 1.42; color: #b7bfc2; }
    .box-purple { border-color: #5d486e; }
    .box-green { border-color: rgba(34, 197, 94, 0.6); }
    .btn { font-family: "Courier New", Courier, monospace; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn:active { transform: translateY(1px); }
    .btn-launch { width: 100%; padding: 10px; background: #0891b2; border: 2px solid #b8f8ff; color: #fff; font-size: 12px; letter-spacing: 0.08em; }
    .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .btn-sub { padding: 8px 6px; font-size: 11px; background: #12182b; border: 1px solid #38e8ff; color: #b8f8ff; }
    .btn-sub-green { padding: 8px 6px; font-size: 11px; background: #11241a; border: 1px solid #22c55e; color: #86efac; }
    .btn-sub-purple { width: 100%; padding: 6px; font-size: 11px; background: #1c1528; border: 1px solid #9d7bb8; color: #e9d5ff; }
    .btn-back { padding: 2px 8px; font-size: 10px; background: #1e293b; border: 1px solid #38e8ff; color: #b8f8ff; }
    .upg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px; background: #0d1324; border: 1px solid #334155; }
    .upg-btn { padding: 6px 8px; font-size: 10px; border: 1px solid #b8f8ff; background: #0891b2; color: #fff; flex-shrink: 0; }
    .upg-btn:disabled { background: #121622; border-color: #334155; color: #64748b; cursor: not-allowed; }
    .dex-card { display: flex; align-items: center; gap: 10px; }
    .dex-card img { width: 82px; height: 50px; object-fit: contain; background: #060811; border: 1px solid #334155; padding: 3px; image-rendering: pixelated; }
    .msg-ok { padding: 6px 8px; background: #0f291e; border: 1px solid #22c55e; color: #86efac; font-size: 10px; font-weight: bold; text-align: center; }
    .end-actions { position: absolute; left: 16px; right: 16px; bottom: 24px; z-index: 20; display: none; flex-direction: column; gap: 8px; }
    .end-actions.visible { display: flex; }
    .term-btn { padding: 10px 4px; font-size: 10px; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="cabinet">
      <canvas id="gameCanvas" width="360" height="640"></canvas>
      <div id="lobbyTop" class="lobby-top">
        <div><span style="color:#38e8ff">GAMECLUB</span> // BAY</div>
        <div class="lobby-badges">
          <span id="badgeCaola" class="badge b-caola">120 $CAOLA</span>
          <span id="badgeGpu" class="badge b-gpu">0 GPU</span>
          <span id="badgeRtx" class="badge b-rtx">0.00 $RTX</span>
        </div>
      </div>
      <div id="lobbyPanel" class="lobby-panel">
        <div class="panel-head">
          <span id="panelTitle">COMMAND TERMINAL // READY</span>
          <button id="backBtn" class="btn btn-back hidden" type="button">[ BACK ]</button>
        </div>
        <div id="panelBody" class="panel-body"></div>
      </div>
      <div id="endActions" class="end-actions">
        <div id="shareStatus" class="msg-ok hidden"></div>
        <div class="btn-grid-3">
          <button id="hangarBtn" class="btn term-btn" style="background:#1c1528;color:#e9d5ff;border:2px solid #9d7bb8;" type="button">[ HANGAR ]</button>
          <button id="replayBtn" class="btn term-btn" style="background:#121622;color:#b8f8ff;border:2px solid #38e8ff;" type="button">[ REPLAY ]</button>
          <button id="shareBtn" class="btn term-btn" style="background:#0891b2;color:#ffffff;border:2px solid #b8f8ff;" type="button">[ SHARE X ]</button>
        </div>
      </div>
    </div>
  </div>

    function defaultSave() {
      return { caola: 120, gpus: 0, rtxStonk: 0, highScore: 0, missionsCleared: 0, maxSector: 1, upgrades: { cannons: 1, firerate: 1, hull: 1, thrusters: 1 } };
    }
    function loadSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem("gameclub_caola_save_v2");
        if (!raw) return defaultSave();
        const p = JSON.parse(raw);
        return {
          caola: typeof p.caola === "number" ? p.caola : 120,
          gpus: typeof p.gpus === "number" ? p.gpus : 0,
          rtxStonk: typeof p.rtxStonk === "number" ? p.rtxStonk : (typeof p.nvdaShares === "number" ? p.nvdaShares : 0),
          highScore: typeof p.highScore === "number" ? p.highScore : 0,
          missionsCleared: typeof p.missionsCleared === "number" ? p.missionsCleared : 0,
          maxSector: typeof p.maxSector === "number" ? Math.max(1, p.maxSector) : 1,
          upgrades: {
            cannons: Math.min(4, Math.max(1, p.upgrades && p.upgrades.cannons ? p.upgrades.cannons : 1)),
            firerate: Math.min(4, Math.max(1, p.upgrades && p.upgrades.firerate ? p.upgrades.firerate : 1)),
            hull: Math.min(4, Math.max(1, p.upgrades && p.upgrades.hull ? p.upgrades.hull : 1)),
            thrusters: Math.min(4, Math.max(1, p.upgrades && p.upgrades.thrusters ? p.upgrades.thrusters : 1))
          }
        };
      } catch (e) { return defaultSave(); }
    }
    let save = loadSave();
    function persistSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

    function makeOffscreen(w, h) {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = false;
      return [c, ctx];
    }
    function px(ctx, x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

    function createDroneSprite() {
      const [c, ctx] = makeOffscreen(32, 32);
      px(ctx, 5, 4, 5, 5, PALETTE.outline); px(ctx, 6, 5, 3, 3, PALETTE.purpleMed);
      px(ctx, 22, 4, 5, 5, PALETTE.outline); px(ctx, 23, 5, 3, 3, PALETTE.purpleMed);
      px(ctx, 13, 2, 6, 4, PALETTE.outline); px(ctx, 14, 3, 4, 2, PALETTE.cyanCore);
      for (let y = 4; y <= 28; y++) for (let x = 4; x <= 28; x++) {
        const d = Math.hypot(x - 16, y - 16);
        if (d <= 11.5 && d > 10.1) px(ctx, x, y, 1, 1, PALETTE.outline);
        else if (d <= 10.1) px(ctx, x, y, 1, 1, (x - 16 + y - 16 < -5) ? PALETTE.hullLight : (y > 20 ? PALETTE.purpleMed : (d > 8.2 ? PALETTE.hullDark : PALETTE.hullMed)));
      }
      px(ctx, 10, 10, 12, 12, PALETTE.outline); px(ctx, 11, 11, 10, 10, PALETTE.purpleDark);
      px(ctx, 12, 12, 8, 8, PALETTE.cyanDeep); px(ctx, 13, 13, 6, 6, PALETTE.cyanCore); px(ctx, 14, 14, 3, 3, PALETTE.cyanBright);
      return c;
    }
    function createInterceptorSprite() {
      const [c, ctx] = makeOffscreen(32, 34);
      px(ctx, 3, 8, 26, 10, PALETTE.outline); px(ctx, 4, 9, 24, 8, PALETTE.purpleMed); px(ctx, 5, 10, 22, 3, PALETTE.purpleLight);
      px(ctx, 10, 3, 12, 26, PALETTE.outline); px(ctx, 11, 4, 10, 24, PALETTE.hullMed); px(ctx, 12, 5, 4, 20, PALETTE.hullLight);
      px(ctx, 13, 24, 6, 6, PALETTE.outline); px(ctx, 14, 25, 4, 4, PALETTE.hullDark);
      px(ctx, 13, 15, 6, 7, PALETTE.outline); px(ctx, 14, 16, 4, 5, PALETTE.redWarn); px(ctx, 15, 17, 2, 2, "#fecdd3");
      px(ctx, 4, 17, 3, 6, PALETTE.armorDeep); px(ctx, 25, 17, 3, 6, PALETTE.armorDeep);
      px(ctx, 4, 22, 3, 2, PALETTE.redWarn); px(ctx, 25, 22, 3, 2, PALETTE.redWarn);

      if (caolaFullImg.complete && caolaFullImg.naturalWidth > 0) ctx.drawImage(caolaFullImg, 44, 82 + bob, 86, 184);
      ctx.fillStyle = "rgba(157, 123, 184, 0.28)"; ctx.fillRect(210, 266, 102, 12); ctx.fillStyle = PALETTE.purpleLight; ctx.fillRect(222, 270, 78, 3);
      if (shipImg.complete && shipImg.naturalWidth > 0) ctx.drawImage(shipImg, 219, 90 + shipBob, 84, 158);
      ctx.font = "bold 9px 'Courier New', monospace"; ctx.textAlign = "center";
      ctx.fillStyle = PALETTE.cyanBright; ctx.fillText("PILOT: CAOLA", 88, 287);
      ctx.fillStyle = PALETTE.purpleLight; ctx.fillText("MK-" + save.upgrades.cannons + " INTERCEPTOR", 261, 287);
    }

    function render() {
      ctx.save(); ctx.imageSmoothingEnabled = false;
      if (phase === "LOBBY") { renderLobbyHangar(); ctx.restore(); return; }
      if (screenShake > 0) { const m = Math.round(screenShake * 16); ctx.translate(Math.round((Math.random() - 0.5) * m), Math.round((Math.random() - 0.5) * m)); }
      renderSciFiBackdrop();

      for (const pk of pickups) {
        const bob = Math.round(Math.sin(pk.pulse) * 2);
        if (pk.kind === "gpu") {
          ctx.fillStyle = "rgba(34, 197, 94, 0.28)"; ctx.fillRect(Math.round(pk.x - 22), Math.round(pk.y - 14 + bob), 44, 28);
          ctx.strokeStyle = PALETTE.chipBright; ctx.lineWidth = 1; ctx.strokeRect(Math.round(pk.x - 22), Math.round(pk.y - 14 + bob), 44, 28);
          if (rtxGpuImg.complete && rtxGpuImg.naturalWidth > 0) ctx.drawImage(rtxGpuImg, Math.round(pk.x - 19), Math.round(pk.y - 12 + bob), 38, 24);
        } else if (pk.kind === "caola") {
          ctx.fillStyle = "rgba(56, 232, 255, 0.20)"; ctx.fillRect(Math.round(pk.x - 10), Math.round(pk.y - 10 + bob), 20, 20);
          ctx.drawImage(caolaShardSprite, Math.round(pk.x - 9), Math.round(pk.y - 9 + bob));
        } else if (pk.kind === "repair") {
          px(ctx, pk.x - 8, pk.y - 8 + bob, 16, 16, PALETTE.outline); px(ctx, pk.x - 7, pk.y - 7 + bob, 14, 14, PALETTE.cyanDeep);
          px(ctx, pk.x - 2, pk.y - 5 + bob, 4, 10, "#ffffff"); px(ctx, pk.x - 5, pk.y - 2 + bob, 10, 4, "#ffffff");
        } else {
          px(ctx, pk.x - 8, pk.y - 8 + bob, 16, 16, PALETTE.outline); px(ctx, pk.x - 7, pk.y - 7 + bob, 14, 14, PALETTE.goldPin);
          px(ctx, pk.x - 3, pk.y - 3 + bob, 6, 6, "#ffffff");
        }
      }

      for (const e of enemies) {
        if (e.escortParentId !== undefined) {
          const parent = enemies.find((p) => p.id === e.escortParentId);
          if (parent) {
            ctx.save();
            ctx.strokeStyle = parent.shieldHp && parent.shieldHp > 0 ? "rgba(56, 232, 255, 0.42)" : "rgba(157, 123, 184, 0.32)";
            ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(Math.round(parent.x), Math.round(parent.y)); ctx.lineTo(Math.round(e.x), Math.round(e.y)); ctx.stroke();
            ctx.restore();
          }
        }
      }

      for (const e of enemies) {
        if (e.kind === "laser") {
          if (e.laserState === "telegraph") { ctx.fillStyle = "rgba(255, 77, 109, 0.55)"; ctx.fillRect(Math.round(e.x - 1), Math.round(e.y + 18), 2, CANVAS_H - e.y); }
          else if (e.laserState === "firing") { ctx.fillStyle = "rgba(255, 77, 109, 0.45)"; ctx.fillRect(Math.round(e.x - 8), Math.round(e.y + 18), 16, CANVAS_H - e.y); ctx.fillStyle = "#ffffff"; ctx.fillRect(Math.round(e.x - 3), Math.round(e.y + 18), 6, CANVAS_H - e.y); }
        }
        ctx.save(); ctx.translate(Math.round(e.x), Math.round(e.y));
        if (e.kind === "drone") ctx.drawImage(droneSprite, -16, -16);
        else if (e.kind === "interceptor") ctx.drawImage(interceptorSprite, -16, -17);
        else if (e.kind === "bomber") ctx.drawImage(bomberSprite, -22, -17);
        else if (e.kind === "spiral") ctx.drawImage(spiralSprite, -17, -17);
        else if (e.kind === "laser") ctx.drawImage(laserStrikerSprite, -19, -19);
        else if (e.kind === "mine") ctx.drawImage(mineSprite, -14, -14);
        else if (e.kind === "shielder") { ctx.drawImage(shielderSprite, -22, -19); }
        else if (e.kind === "turret") {
          ctx.drawImage(turretBaseSprite, -18, -18); ctx.save(); ctx.rotate(e.aimAngle);
          px(ctx, 0, -4, 18, 8, PALETTE.outline); px(ctx, 2, -3, 15, 6, PALETTE.hullMed); px(ctx, 14, -3, 4, 6, PALETTE.armorDeep); ctx.restore();
        } else if (e.kind === "transport") {
          if (rtxTransportImg.complete && rtxTransportImg.naturalWidth > 0) ctx.drawImage(rtxTransportImg, -48, -48, 96, 97);
          if (e.shieldHp && e.shieldHp > 0 && e.maxShieldHp) {
            ctx.strokeStyle = "rgba(56, 232, 255, " + (0.45 + 0.25 * Math.sin(e.phase * 6)).toFixed(2) + ")";
            ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 52, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = "rgba(157, 123, 184, 0.55)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 57, e.phase, e.phase + Math.PI * 1.3); ctx.stroke();
          }
          px(ctx, -34, -60, 68, 5, PALETTE.outline); px(ctx, -33, -59, Math.round(66 * Math.max(0, e.hp / e.maxHp)), 3, PALETTE.chipBright);
          if (e.maxShieldHp && (e.shieldHp || 0) > 0) {
            px(ctx, -34, -54, 68, 4, PALETTE.outline); px(ctx, -33, -53, Math.round(66 * Math.max(0, (e.shieldHp || 0) / e.maxShieldHp)), 2, PALETTE.cyanCore);
          }
          ctx.font = "bold 8px 'Courier New', monospace"; ctx.textAlign = "center"; ctx.fillStyle = PALETTE.chipBright; ctx.fillText("RTX TRANSPORT", 0, -64);
        }
        if (e.kind !== "transport" && e.shieldHp && e.shieldHp > 0) { ctx.strokeStyle = PALETTE.cyanCore; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, e.kind === "shielder" ? 26 : 19, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); }
        if (e.hitFlash > 0) { ctx.fillStyle = "rgba(184, 248, 255, 0.55)"; ctx.fillRect(-e.w / 2 + 4, -e.h / 2 + 4, e.w - 8, e.h - 8); }
        ctx.restore();
      }

      if (boss.active) {
        const bx = Math.round(boss.x - boss.w / 2), by = Math.round(boss.y - boss.h / 2);
        ctx.drawImage(bossSprite, bx, by);
        ctx.fillStyle = "rgba(56, 232, 255, " + (0.25 + 0.25 * Math.sin(boss.corePulse)).toFixed(2) + ")";
        ctx.fillRect(Math.round(boss.x - 12), Math.round(boss.y - 12), 24, 24);
        if (boss.hitFlash > 0) { ctx.fillStyle = "rgba(184, 248, 255, 0.45)"; ctx.fillRect(bx + 6, by + 6, boss.w - 12, boss.h - 12); }
      }

      for (const b of bullets) {
        for (let t = 0; t < b.trail.length; t++) {
          const pt = b.trail[t];
          ctx.fillStyle = b.kind === "rail" ? "rgba(184, 248, 255, 0.65)" : b.kind === "missile" ? "rgba(250, 204, 21, 0.45)" : b.fromPlayer ? "rgba(56, 232, 255, 0.35)" : "rgba(255, 77, 109, 0.35)";
          const sz = b.kind === "rail" ? b.size : Math.max(1, b.size - 1);
          ctx.fillRect(Math.round(pt.x - sz / 2), Math.round(pt.y - sz / 2), sz, b.kind === "rail" ? 10 : sz);
        }
        ctx.fillStyle = PALETTE.outline; ctx.fillRect(Math.round(b.x - b.size / 2 - 1), Math.round(b.y - b.size / 2 - 1), b.size + 2, b.size + 2);
        ctx.fillStyle = b.color; ctx.fillRect(Math.round(b.x - b.size / 2), Math.round(b.y - b.size / 2), b.size, b.kind === "rail" ? 12 : b.size);
      }

      if (phase === "PLAYING") {
        const blink = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 18) % 2 === 0;
        if (!blink) {
          const sx = Math.round(player.x - player.w / 2), sy = Math.round(player.y - player.h / 2);
          if (shipImg.complete && shipImg.naturalWidth > 0) ctx.drawImage(shipImg, sx, sy, player.w, player.h);
          else px(ctx, sx + 12, sy, player.w - 24, player.h, PALETTE.hullMed);
          if (muzzleFlashTimer > 0) { ctx.fillStyle = "rgba(184, 248, 255, 0.75)"; ctx.fillRect(Math.round(player.x - 8), sy - 6, 16, 8); }
          if (overdriveTimer > 0) { ctx.strokeStyle = PALETTE.goldPin; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.round(player.x), Math.round(player.y), 46, 0, Math.PI * 2); ctx.stroke(); }
        }
      }

      for (const sw of shockwaves) {
        ctx.save(); ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife); ctx.strokeStyle = sw.color; ctx.lineWidth = sw.width;
        ctx.beginPath(); ctx.arc(Math.round(sw.x), Math.round(sw.y), Math.round(sw.radius), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      for (const pt of particles) { ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife); ctx.fillStyle = pt.color; ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size); }
      ctx.globalAlpha = 1;
      ctx.font = "bold 10px 'Courier New', monospace"; ctx.textAlign = "center";
      for (const pop of popups) { ctx.fillStyle = PALETTE.outline; ctx.fillText(pop.text, Math.round(pop.x) + 1, Math.round(pop.y) + 1); ctx.fillStyle = pop.color; ctx.fillText(pop.text, Math.round(pop.x), Math.round(pop.y)); }

      if (bossWarningTimer > 0 && Math.floor(bossWarningTimer * 6) % 2 === 0) {
        ctx.fillStyle = "rgba(157, 23, 77, 0.85)"; ctx.fillRect(20, 260, CANVAS_W - 40, 42);
        ctx.strokeStyle = PALETTE.redWarn; ctx.lineWidth = 2; ctx.strokeRect(20, 260, CANVAS_W - 40, 42);
        ctx.font = "bold 13px 'Courier New', monospace"; ctx.fillStyle = "#ffffff"; ctx.fillText("!! WARNING: COMPUTING CORE !!", CANVAS_W / 2, 285);
      }

      ctx.fillStyle = PALETTE.hudBg; ctx.fillRect(0, 0, CANVAS_W, 58); ctx.fillStyle = PALETTE.cyanDeep; ctx.fillRect(0, 57, CANVAS_W, 1);
      if (pilotImg.complete && pilotImg.naturalWidth > 0) {
        ctx.fillStyle = PALETTE.outline; ctx.fillRect(6, 6, 30, 30); ctx.drawImage(pilotImg, 7, 7, 28, 28);
        ctx.strokeStyle = PALETTE.cyanCore; ctx.lineWidth = 1; ctx.strokeRect(6.5, 6.5, 29, 29);
      }
      ctx.font = "bold 10px 'Courier New', monospace"; ctx.textAlign = "left"; ctx.fillStyle = PALETTE.hullLight;
      ctx.fillText("HP " + player.hp + "/" + player.maxHp, 42, 15);
      px(ctx, 42, 19, 92, 8, PALETTE.outline);
      const hpR = player.hp / player.maxHp;
      px(ctx, 43, 20, Math.round(90 * hpR), 6, hpR > 0.5 ? PALETTE.cyanCore : hpR > 0.25 ? PALETTE.goldPin : PALETTE.redWarn);
      ctx.textAlign = "center"; ctx.fillStyle = PALETTE.chipBright; ctx.fillText("$CAOLA:" + runCaola, 190, 15);
      ctx.fillStyle = PALETTE.goldPin; ctx.fillText("RTX GPU:" + runGpus, 190, 28);
      ctx.textAlign = "right";
      if (boss.active) { ctx.fillStyle = PALETTE.redWarn; ctx.fillText("S" + currentSector + " CORE:" + Math.max(0, Math.ceil((boss.hp / boss.maxHp) * 100)) + "%", CANVAS_W - 8, 15); }
      else { ctx.fillStyle = PALETTE.cyanBright; ctx.fillText("SEC-" + currentSector + ":" + Math.floor(levelProgress) + "%", CANVAS_W - 8, 15); }

      ctx.fillStyle = "rgba(20, 28, 48, 0.92)"; ctx.fillRect(wpnBtnHitbox.x, wpnBtnHitbox.y, wpnBtnHitbox.w, wpnBtnHitbox.h);
      ctx.strokeStyle = weaponMode === "RAIL" ? PALETTE.cyanBright : weaponMode === "SPREAD" ? PALETTE.goldPin : PALETTE.cyanCore;
      ctx.lineWidth = 1; ctx.strokeRect(wpnBtnHitbox.x + 0.5, wpnBtnHitbox.y + 0.5, wpnBtnHitbox.w - 1, wpnBtnHitbox.h - 1);
      ctx.font = "bold 9px 'Courier New', monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#ffffff";
      ctx.fillText(weaponMode, wpnBtnHitbox.x + wpnBtnHitbox.w / 2, wpnBtnHitbox.y + 12);

      ctx.fillStyle = autoFire ? "rgba(34, 197, 94, 0.28)" : "rgba(24, 30, 48, 0.9)"; ctx.fillRect(autoBtnHitbox.x, autoBtnHitbox.y, autoBtnHitbox.w, autoBtnHitbox.h);
      ctx.strokeStyle = autoFire ? PALETTE.chipBright : PALETTE.hullDark; ctx.strokeRect(autoBtnHitbox.x + 0.5, autoBtnHitbox.y + 0.5, autoBtnHitbox.w - 1, autoBtnHitbox.h - 1);
      ctx.fillStyle = autoFire ? PALETTE.chipBright : PALETTE.hullLight; ctx.fillText(autoFire ? "AUTO:ON" : "AUTO:OF", autoBtnHitbox.x + autoBtnHitbox.w / 2, autoBtnHitbox.y + 12);

      px(ctx, 8, 43, CANVAS_W - 138, 6, PALETTE.outline);
      if (boss.active) px(ctx, 9, 44, Math.round((CANVAS_W - 140) * Math.max(0, boss.hp / boss.maxHp)), 4, PALETTE.redWarn);
      else px(ctx, 9, 44, Math.round((CANVAS_W - 140) * (levelProgress / 100)), 4, PALETTE.cyanCore);

      if (phase === "PLAYING") {
        ctx.save(); ctx.beginPath(); ctx.arc(joyCenter.x, joyCenter.y, joyCenter.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(18, 22, 34, 0.35)"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(56, 232, 255, 0.45)"; ctx.stroke();
        ctx.beginPath(); ctx.arc(Math.round(joyCenter.x + joyVec.x * (joyCenter.r - 12)), Math.round(joyCenter.y + joyVec.y * (joyCenter.r - 12)), 15, 0, Math.PI * 2);
        ctx.fillStyle = joyTouchId !== null ? "rgba(56, 232, 255, 0.72)" : "rgba(56, 232, 255, 0.40)"; ctx.fill(); ctx.restore();

        [{ btn: empBtn, cd: empCooldown, label: "EMP", color: PALETTE.cyanCore }, { btn: ovrBtn, cd: overdriveCooldown, label: "OVR", color: PALETTE.goldPin }].forEach((s) => {
          const r = s.cd <= 0;
          ctx.save(); ctx.beginPath(); ctx.arc(s.btn.x, s.btn.y, s.btn.r, 0, Math.PI * 2);
          ctx.fillStyle = r ? "rgba(18, 28, 48, 0.62)" : "rgba(10, 12, 20, 0.55)"; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = r ? s.color : "rgba(100, 116, 139, 0.45)"; ctx.stroke();
          ctx.font = "bold 9px 'Courier New', monospace"; ctx.textAlign = "center"; ctx.fillStyle = r ? "#ffffff" : "#94a3b8";
          ctx.fillText(r ? s.label : Math.ceil(s.cd) + "s", s.btn.x, s.btn.y + 3); ctx.restore();
        });

        ctx.save(); ctx.beginPath(); ctx.arc(fireBtn.x, fireBtn.y, fireBtn.r, 0, Math.PI * 2);
        ctx.fillStyle = (firePressed || autoFire) ? "rgba(56, 232, 255, 0.52)" : "rgba(18, 22, 34, 0.35)"; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = (firePressed || autoFire) ? PALETTE.cyanBright : "rgba(56, 232, 255, 0.50)"; ctx.stroke();
        ctx.font = "bold 11px 'Courier New', monospace"; ctx.textAlign = "center"; ctx.fillStyle = "rgba(184, 248, 255, 0.88)"; ctx.fillText("FIRE", fireBtn.x, fireBtn.y + 4); ctx.restore();
      }

      if (phase === "VICTORY" || phase === "GAMEOVER") {
        const win = phase === "VICTORY";
        ctx.fillStyle = "rgba(6, 9, 18, 0.88)"; ctx.fillRect(18, 86, CANVAS_W - 36, 404);
        ctx.strokeStyle = win ? PALETTE.cyanCore : PALETTE.redWarn; ctx.lineWidth = 2; ctx.strokeRect(18, 86, CANVAS_W - 36, 404);
        if (caolaFullImg.complete && caolaFullImg.naturalWidth > 0) ctx.drawImage(caolaFullImg, 34, 102, 54, 114);
        if (rtxGpuImg.complete && rtxGpuImg.naturalWidth > 0) ctx.drawImage(rtxGpuImg, CANVAS_W - 134, 128, 96, 60);
        ctx.textAlign = "center"; ctx.font = "bold 20px 'Courier New', monospace"; ctx.fillStyle = win ? PALETTE.cyanBright : PALETTE.redWarn;
        ctx.fillText(win ? "SECTOR " + currentSector + " CLEARED!" : "SIGNAL LOST // KIA", CANVAS_W / 2, 244);
        ctx.font = "bold 11px 'Courier New', monospace"; ctx.fillStyle = PALETTE.hullLight;
        ctx.fillText(win ? "NEXT SECTOR UNLOCKED IN HANGAR!" : "RECOVERED LOOT SAVED TO HANGAR.", CANVAS_W / 2, 264);
        ctx.fillStyle = "#0d1324"; ctx.fillRect(36, 282, CANVAS_W - 72, 134); ctx.strokeStyle = PALETTE.purpleLight; ctx.lineWidth = 1; ctx.strokeRect(36, 282, CANVAS_W - 72, 134);
        ctx.font = "bold 12px 'Courier New', monospace";
        ctx.fillStyle = PALETTE.chipBright; ctx.fillText("SORTIE $CAOLA : +" + runCaola, CANVAS_W / 2, 308);
        ctx.fillStyle = PALETTE.goldPin; ctx.fillText("RTX GPUs LOOTED: +" + runGpus, CANVAS_W / 2, 332);
        ctx.fillStyle = PALETTE.cyanBright; ctx.fillText("TOTAL RTX GPUs : " + save.gpus, CANVAS_W / 2, 356);
        ctx.fillStyle = "#ffffff"; ctx.fillText("$RTX STONK     : " + save.rtxStonk.toFixed(2) + " $RTX", CANVAS_W / 2, 380);
        ctx.fillStyle = PALETTE.hullLight; ctx.fillText("UNITS DOWNED   : " + enemiesDestroyed, CANVAS_W / 2, 404);
      }
      ctx.restore();
    }

    function shareToX() {
      const resultLabel = phase === "VICTORY" ? "SECTOR " + currentSector + " CLEARED" : "SECTOR " + currentSector + " // KIA";
      const tweetText = "GameClub Battle Report [" + resultLabel + "] — Earned " + runCaola + " $CAOLA & " + runGpus + " RTX GPUs! Portfolio: " + save.rtxStonk.toFixed(2) + " $RTX Stonk.";
      const params = new URLSearchParams({ text: tweetText, url: GAME_SHARE_URL });
      const xIntentUrl = "https://x.com/intent/tweet?" + params.toString();
      canvas.toBlob(async (blob) => {
        if (blob) {
          let copied = false;
          try { if (navigator.clipboard && typeof ClipboardItem !== "undefined") { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); copied = true; } } catch (e) {}
          const dlUrl = URL.createObjectURL(blob), a = document.createElement("a");
          a.href = dlUrl; a.download = "gameclub-caola-" + runCaola + ".png"; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(dlUrl), 5000);
          shareStatusEl.textContent = copied ? "SCREENSHOT COPIED & SAVED — PASTE INTO X POST!" : "SCREENSHOT SAVED (.PNG) — ATTACH TO X POST!";
          shareStatusEl.classList.remove("hidden");
        }
      }, "image/png");
      window.open(xIntentUrl, "_blank", "width=560,height=440,noopener,noreferrer");
    }

    hangarBtn.onclick = () => { phase = "LOBBY"; lobbyTab = "HOME"; syncLobbyUI(); };
    replayBtn.onclick = startMission;
    shareBtn.onclick = shareToX;

    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now; lobbyAnimTime += dt;
      updateScroll(dt);
      if (phase === "PLAYING") { updatePlayer(dt); updateBullets(dt); updateEnemies(dt); updatePickups(dt); updateCollisions(); }
      updateParticles(dt); render(); requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  })();
  </script>
</body>
</html>
